name: Deploy to GitHub Pages

# Builds the static site and publishes it to the `gh-pages` branch.
# In Settings → Pages choose "Deploy from a branch" → `gh-pages` / `(root)`.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run validate
      - name: Build
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then base=""; else base="/$repo"; fi
          NEXT_PUBLIC_BASE_PATH="$base" npm run build
          touch out/.nojekyll
        env:
          NEXT_TELEMETRY_DISABLED: 1
      - name: Publish to gh-pages
        working-directory: out
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
